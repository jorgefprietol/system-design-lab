name: Container CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate frontend and Compose
        run: |
          node --check web/app.js
          node --check web/commerce.js
          node --check tests/horizontal.mjs
          docker compose config --quiet
      - name: Build pinned runtime images
        env:
          LAB_REVISION: ${{ github.sha }}
        run: |
          docker compose build
          docker build --file database/Dockerfile --build-arg REVISION="$LAB_REVISION" --tag atlas-postgres:local .
      - name: Run shared contract against containers
        env:
          LAB_TEST_MODE: container
        run: node tests/contract.mjs
      - name: Verify two-instance commerce with shared PostgreSQL
        run: node tests/horizontal.mjs
      - name: Generate SBOM and enforce vulnerability gate
        run: |
          mkdir -p release
          for runtime in csharp java; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/release:/reports" -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --scanners vuln --format json --output "/reports/$runtime-vulnerabilities.json" "atlas-$runtime:local"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "atlas-$runtime:local"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/release:/reports" -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --format cyclonedx --output "/reports/$runtime-sbom.cdx.json" "atlas-$runtime:local"
          done
          postgres_image=$(cat release/postgres-image.txt)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/release:/reports" -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --scanners vuln --format json --output /reports/postgres-vulnerabilities.json "$postgres_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$postgres_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/release:/reports" -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 10m --format cyclonedx --output /reports/postgres-sbom.cdx.json "$postgres_image"
      - name: Package tested images by full commit SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/package-release.mjs
      - name: Save test and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence
          path: |
            tests/results/**/report.json
            tests/results/**/*.log
            release/*-vulnerabilities.json
            release/*-sbom.cdx.json
          retention-days: 7
      - name: Save deployment bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: release/
          compression-level: 0
          retention-days: 2
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release
      - name: Attest container archives
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: release/*
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag; immutable assets retained."
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Atlas ${GITHUB_SHA:0:12}" --notes-file release/notes.md --draft
          gh release edit "$tag" --draft=false
