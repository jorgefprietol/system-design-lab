# Opt-in overlay: docker compose -f compose.yaml -f compose.commerce.yaml up -d --wait
services:
  csharp:
    environment:
      LAB_COMMERCE_HOST: commerce-db
      LAB_COMMERCE_PASSWORD_FILE: /run/secrets/commerce_app_password
      LAB_INSTANCE: csharp-1
      LAB_COMMERCE_PEER_URL: http://127.0.0.1:${JAVA_PORT:-5082}/commerce
    secrets: [commerce_app_password]
    depends_on:
      commerce-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/commerce/health]
  java:
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      LAB_COMMERCE_HOST: commerce-db
      LAB_COMMERCE_PASSWORD_FILE: /run/secrets/commerce_app_password
      LAB_INSTANCE: java-2
      LAB_COMMERCE_PEER_URL: http://127.0.0.1:${CSHARP_PORT:-5081}/commerce
    secrets: [commerce_app_password]
    depends_on:
      commerce-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/commerce/health]
  commerce-db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_commerce
      POSTGRES_USER: atlas_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/commerce_admin_password
    secrets: [commerce_admin_password, commerce_app_password]
    volumes:
      - commerce-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U atlas_admin -d atlas_commerce"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  commerce-data: {name: atlas-commerce-data}
secrets:
  commerce_app_password:
    file: ${ATLAS_SECRET_DIR:-./.local/commerce-secrets}/app-password
  commerce_admin_password:
    file: ${ATLAS_SECRET_DIR:-./.local/commerce-secrets}/admin-password
