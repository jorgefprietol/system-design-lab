# Opt-in overlay: docker compose -f compose.yaml -f compose.commerce.yaml up -d --wait
services:
  csharp:
    environment:
      LAB_COMMERCE_HOST: commerce-db
      LAB_COMMERCE_PASSWORD_FILE: /run/secrets/app/app-password
      LAB_INSTANCE: csharp-1
      LAB_COMMERCE_PEER_URL: http://127.0.0.1:${JAVA_PORT:-5082}/commerce
    volumes: ["commerce-app-secrets:/run/secrets/app:ro"]
    depends_on:
      commerce-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/commerce/health]
  java:
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      LAB_COMMERCE_HOST: commerce-db
      LAB_COMMERCE_PASSWORD_FILE: /run/secrets/app/app-password
      LAB_INSTANCE: java-2
      LAB_COMMERCE_PEER_URL: http://127.0.0.1:${CSHARP_PORT:-5081}/commerce
    volumes: ["commerce-app-secrets:/run/secrets/app:ro"]
    depends_on:
      commerce-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/commerce/health]
  commerce-db:
    image: ${COMMERCE_DB_IMAGE:-atlas-postgres:local}
    build:
      context: .
      dockerfile: database/Dockerfile
      args: {REVISION: "${LAB_REVISION:-development}"}
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_commerce
      POSTGRES_USER: atlas_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin/admin-password
    volumes:
      - commerce-data:/var/lib/postgresql/data
      - commerce-admin-secrets:/run/secrets/admin:ro
      - commerce-app-secrets:/run/secrets/app:ro
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U atlas_admin -d atlas_commerce"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  commerce-data: {name: atlas-commerce-data}
  commerce-app-secrets: {name: atlas-commerce-app-secrets}
  commerce-admin-secrets: {name: atlas-commerce-admin-secrets}
